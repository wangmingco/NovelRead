<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3ece0" />
<meta name="description" content="墨读 — 一个把小说存在浏览器里的移动端阅读器" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="墨读" />
<meta name="format-detection" content="telephone=no" />
<title>墨读 · InkRead</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/shelf.css" />
<link rel="stylesheet" href="assets/css/reader.css" />
</head>
<body>

<!-- ─────────── 图标精灵 ─────────── -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h10M4 12h10M4 18h6"/><path d="M18 5v14"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-bookmark-fill" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" fill="currentColor"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4"/><path d="M5 18h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4h-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 18.5V5.5"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 9.6 3.7 3.7 0 0 1 17.5 18z"/><path d="M12 12.5V16m0 0l-1.6-1.6M12 16l1.6-1.6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l8.5 15h-17z"/><path d="M12 10v4M12 16.6v.4"/></symbol>
    <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" /></symbol>
  </defs>
</svg>

<div id="app">

  <!-- ═══════════ 书架 ═══════════ -->
  <section id="view-shelf" class="view view--shelf">
    <header class="shelf-bar">
      <div class="brand">
        <span class="brand-seal">墨</span>
        <span class="brand-name"><b>墨读</b><i>INKREAD</i></span>
      </div>
      <div class="shelf-bar-actions">
        <button class="icon-btn" id="btn-storage" aria-label="存储信息"><svg class="icon"><use href="#i-cloud"/></svg></button>
        <button class="icon-btn" id="btn-refresh" aria-label="刷新书库"><svg class="icon"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="btn-shelf-settings" aria-label="阅读设置"><svg class="icon"><use href="#i-sliders"/></svg></button>
      </div>
    </header>

    <div class="shelf-scroll" id="shelf-scroll">
      <div class="hero-slot" id="hero-slot"></div>

      <div class="shelf-search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="search" id="shelf-search" placeholder="搜索书名、作者或标签" autocomplete="off" enterkeyhint="search" />
      </div>

      <div class="tabs" id="shelf-tabs" role="tablist">
        <button class="tab is-active" data-tab="all" role="tab">全部<span class="tab-n" data-count="all"></span></button>
        <button class="tab" data-tab="downloaded" role="tab">已下载<span class="tab-n" data-count="downloaded"></span></button>
        <button class="tab" data-tab="reading" role="tab">在读<span class="tab-n" data-count="reading"></span></button>
      </div>

      <div class="book-grid" id="book-grid"></div>

      <div class="shelf-empty" id="shelf-empty" hidden>
        <div class="empty-mark">空</div>
        <p>这里还没有书。<br />点上面的按钮把书下载到浏览器里吧。</p>
      </div>

      <footer class="shelf-foot" id="shelf-foot"></footer>
      <div class="shelf-bottom-space"></div>
    </div>
  </section>

  <!-- ═══════════ 阅读器 ═══════════ -->
  <section id="view-reader" class="view view--reader" hidden>
    <div class="reader" id="reader">
      <div class="reader-stage" id="reader-stage">
        <article class="reader-stream" id="reader-stream"></article>
      </div>

      <div class="reader-hint" id="reader-hint" hidden></div>

      <header class="chrome chrome--top" id="chrome-top">
        <button class="icon-btn icon-btn--ghost" id="btn-back" aria-label="返回书架"><svg class="icon"><use href="#i-back"/></svg></button>
        <button class="chrome-title" id="btn-book-info">
          <b id="reader-title">书名</b>
          <i id="reader-sub">章节</i>
        </button>
        <button class="icon-btn icon-btn--ghost" id="btn-quick-bookmark" aria-label="添加书签"><svg class="icon"><use href="#i-bookmark"/></svg></button>
      </header>

      <div class="chrome chrome--bottom" id="chrome-bottom">
        <div class="seek">
          <button class="step" id="btn-prev-chapter" aria-label="上一章"><svg class="icon"><use href="#i-back"/></svg></button>
          <div class="seek-track">
            <input type="range" id="book-range" min="0" max="0" step="1" value="0" aria-label="阅读进度" />
            <div class="seek-meta"><span id="seek-chapter">第 1 章</span><span id="seek-percent">0%</span></div>
          </div>
          <button class="step" id="btn-next-chapter" aria-label="下一章"><svg class="icon"><use href="#i-next"/></svg></button>
        </div>
        <nav class="tools">
          <button class="tool" data-tool="toc"><svg class="icon"><use href="#i-list"/></svg><span>目录</span></button>
          <button class="tool" data-tool="bookmarks"><svg class="icon"><use href="#i-bookmark"/></svg><span>书签</span></button>
          <button class="tool" data-tool="settings"><svg class="icon"><use href="#i-sliders"/></svg><span>设置</span></button>
        </nav>
      </div>

      <div class="reader-status" id="reader-status">
        <span id="status-chapter">第一章</span>
        <span id="status-right"><span id="status-clock">--:--</span><span class="dot">·</span><span id="status-percent">0%</span></span>
      </div>

      <div class="page-badge" id="page-badge" hidden></div>
    </div>
  </section>
</div>

<!-- ═══════════ 抽屉 ═══════════ -->
<div class="backdrop" id="backdrop" hidden></div>

<section class="sheet" id="sheet-toc" hidden aria-label="目录">
  <div class="sheet-panel">
    <div class="grab"></div>
    <header class="sheet-head">
      <h3>目录</h3>
      <span class="sheet-sub" id="toc-sub"></span>
      <button class="icon-btn sheet-x" data-close><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet-filter">
      <svg class="icon"><use href="#i-search"/></svg>
      <input type="search" id="toc-filter" placeholder="搜索章节名" autocomplete="off" />
    </div>
    <div class="sheet-body" id="toc-list"></div>
  </div>
</section>

<section class="sheet" id="sheet-marks" hidden aria-label="书签">
  <div class="sheet-panel">
    <div class="grab"></div>
    <header class="sheet-head">
      <h3>书签</h3>
      <span class="sheet-sub" id="marks-sub"></span>
      <button class="icon-btn sheet-x" data-close><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet-actions">
      <button class="btn btn--primary btn--block" id="btn-add-bookmark">
        <svg class="icon"><use href="#i-plus"/></svg>在当前位置添加书签
      </button>
    </div>
    <div class="sheet-body" id="marks-list"></div>
  </div>
</section>

<section class="sheet" id="sheet-settings" hidden aria-label="阅读设置">
  <div class="sheet-panel">
    <div class="grab"></div>
    <header class="sheet-head">
      <h3>阅读设置</h3>
      <span class="sheet-sub"></span>
      <button class="icon-btn sheet-x" data-close><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet-body settings-body" id="settings-body"></div>
  </div>
</section>

<section class="sheet" id="sheet-book" hidden aria-label="书籍详情">
  <div class="sheet-panel">
    <div class="grab"></div>
    <header class="sheet-head">
      <h3 id="book-sheet-title">书籍</h3>
      <span class="sheet-sub"></span>
      <button class="icon-btn sheet-x" data-close><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet-body" id="book-sheet-body"></div>
  </div>
</section>

<div class="toast-root" id="toast-root"></div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
